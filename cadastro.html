<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — FutFlex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="website icon" href="img/Logo.png">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="img/Logo.png" alt="FutFlex">
      <span>FUT<em>FLEX</em></span>
    </a>
    <nav class="nav-links">
      <a href="produtos.html">Produtos</a>
      <a href="produtos.html?categoria=brasil">Brasil</a>
      <a href="produtos.html?categoria=europa">Europa</a>
      <a href="produtos.html?categoria=selecoes">Seleções</a>
    </nav>
    <div class="header-actions">
      <a href="carrinho.html" class="icon-btn" aria-label="Carrinho">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <button class="burger" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card wide">
    <div class="auth-body">
      <h1>Cadastro</h1>
      <form id="cadastro-form" novalidate>
        <div class="field-lg">
          <label for="cad-name">Nome completo</label>
          <div class="input-wrap">
            <input type="text" id="cad-name" required placeholder="Como podemos te chamar?">
          </div>
        </div>
        <div class="field-lg">
          <label for="cad-email">E-mail</label>
          <div class="input-wrap">
            <input type="email" id="cad-email" required placeholder="seuemail@exemplo.com">
          </div>
        </div>
        <div class="field-lg">
          <label for="cad-senha">Senha</label>
          <div class="input-wrap">
            <input type="password" id="cad-senha" required placeholder="Mínimo 6 caracteres" minlength="6">
            <button type="button" class="toggle-pass" data-target="cad-senha" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field-lg">
          <label for="cad-confirma">Confirmar senha</label>
          <div class="input-wrap">
            <input type="password" id="cad-confirma" required placeholder="Repita a senha" minlength="6">
            <button type="button" class="toggle-pass" data-target="cad-confirma" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <p class="form-error" id="cad-error">As senhas não coincidem ou os termos não foram aceitos.</p>
      <div class="auth-links">Já tem uma conta? <a href="login.html">Faça login</a></div>  
        <button type="submit" class="btn btn-primary btn-block">Feito</button>
      </form>
    </div>
    <img class="auth-img" src="img/banner.cadastro.png" alt="Banner Cadastro FutFlex">
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/products.js"></script>
<script src="js/script.js"></script>
<script src="js/footer.js"></script>
<script>
document.getElementById("cadastro-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("cad-name").value.trim();
  const email = document.getElementById("cad-email").value.trim();
  const senha = document.getElementById("cad-senha").value;
  const confirma = document.getElementById("cad-confirma").value;
  const error = document.getElementById("cad-error");
  const btn = e.target.querySelector("button[type=submit]");

  if (!name || senha.length < 6 || senha !== confirma) {
    error.textContent = "Confira seu nome, a senha (mín. 6 caracteres) e aceite os termos.";
    error.classList.add("show");
    return;
  }
  error.classList.remove("show");
  btn.disabled = true;

  try {
    console.log("🔄 Criando usuário no Firebase Auth...");
    const cred = await auth.createUserWithEmailAndPassword(email, senha);
    console.log("✅ Usuário criado com UID:", cred.user.uid);

    console.log("🔄 Salvando dados na coleção 'users'...");
    await db.collection("users").doc(cred.user.uid).set({
      name,
      email,
      role: "cliente",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    console.log("✅ Dados salvos no Firestore com sucesso!");

    showToast("Cadastro realizado com sucesso!");
    
    setTimeout(() => {
      location.href = "index.html";
    }, 1500);

  } catch (err) {
    console.error(" Erro detalhado no cadastro:", err);
    error.textContent = mapAuthError(err.code) || "Erro ao cadastrar. Tente novamente.";
    error.classList.add("show");
    btn.disabled = false;
  }
});

  document.querySelectorAll(".toggle-pass").forEach((btn) => {
  btn.addEventListener("click", () => {
    const targetId = btn.getAttribute("data-target");
    const input = document.getElementById(targetId);
    if (!input) return;

    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";

    
    btn.innerHTML = isHidden
      ? `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
      : `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>`;
  });
});

</script>
</body>
</html>
