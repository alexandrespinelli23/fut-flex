<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Vendedor — FutFlex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="website icon" href="img/Logo.png">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="img/Logo.png" alt="FutFlex">
      <span>FUT<em>FLEX</em></span>
    </a>
    <nav class="nav-links">
      <a href="produtos.html">Produtos</a>
    </nav>
    <div class="header-actions">
      <a href="index.html" class="icon-btn" aria-label="Voltar à loja">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      </a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="ph auth-img" data-label="banner"></div>
    <div class="auth-body">
      <h1>Área do Vendedor</h1>
      <p style="text-align:center; color:#9db3cf; font-size:.78rem; margin:-14px 0 24px;">Acesso exclusivo para lojistas parceiros FutFlex</p>
      <form id="seller-login-form" novalidate>
        <div class="field-lg">
          <label for="seller-email">E-mail do vendedor</label>
          <div class="input-wrap">
            <input type="email" id="seller-email" required placeholder="vendedor@futflex.com">
          </div>
        </div>
        <div class="field-lg">
          <label for="seller-senha">Senha</label>
          <div class="input-wrap">
            <input type="password" id="seller-senha" required placeholder="••••••••" minlength="6">
            <button type="button" class="toggle-pass" data-target="seller-senha" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <p class="form-error" id="seller-error">E-mail ou senha inválidos.</p>
        <div class="auth-links">
          Acesso restrito a contas com permissão de vendedor.<br>
          É cliente? <a href="login.html">Faça login por aqui</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar no painel</button>
      </form>
    </div>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/products.js"></script>
<script src="js/script.js"></script>
<script src="js/footer.js"></script>
<script>
  document.querySelectorAll(".toggle-pass").forEach((btn) => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      input.type = input.type === "password" ? "text" : "password";
    });
  });

  document.getElementById("seller-login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("seller-email").value.trim();
    const senha = document.getElementById("seller-senha").value;
    const errorEl = document.getElementById("seller-error");
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;

    try {
      const cred = await auth.signInWithEmailAndPassword(email, senha);
      const userDoc = await db.collection("users").doc(cred.user.uid).get();

      if (!userDoc.exists || userDoc.data().role !== "vendedor") {
        await auth.signOut();
        errorEl.textContent = "Essa conta não tem acesso ao painel do vendedor.";
        errorEl.classList.add("show");
        btn.disabled = false;
        return;
      }

      errorEl.classList.remove("show");
      showToast("Bem-vindo(a) de volta!");
      setTimeout(() => location.href = "painel-vendedor.html", 700);
    } catch (err) {
      errorEl.textContent = mapAuthError(err.code);
      errorEl.classList.add("show");
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
