<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos — FutFlex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="website icon" href="img/Logo.png">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="img/Logo.png" alt="FutFlex">
      <span>FUT<em>FLEX</em></span>
    </a>
    <nav class="nav-links">
      <a href="produtos.html">Produtos</a>
      <a href="produtos.html?categoria=brasil">Brasil</a>
      <a href="produtos.html?categoria=europa">Europa</a>
      <a href="produtos.html?categoria=selecoes">Seleções</a>
    </nav>
    <div class="header-actions">
      <a href="carrinho.html" class="icon-btn" aria-label="Carrinho">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <a href="login.html" class="icon-btn" id="account-link" aria-label="Minha conta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </a>
      <button class="burger" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1 id="page-title">Produtos</h1>
    <div class="crumbs"><a href="index.html">Início</a> / Produtos</div>
  </div>
</section>

<section class="section">
  <div class="container">

    <div class="filter-bar">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="Pesquisar camisas, times...">
      </div>
      <select class="pill-select" id="category-select">
        <option value="">Categorias</option>
        <option value="europa">Europa</option>
        <option value="brasil">Brasil</option>
        <option value="selecoes">Seleções</option>
      </select>
      <select class="pill-select" id="sort-select">
        <option value="relevancia">Relevância</option>
        <option value="menor-preco">Menor preço</option>
        <option value="maior-preco">Maior preço</option>
        <option value="az">Nome A-Z</option>
      </select>
    </div>

    <p class="results-count" id="results-count"></p>

    <div class="product-grid" id="product-grid"></div>

    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="ph round" data-label="?"></div>
      <p>Nenhum produto encontrado com esses filtros.<br>Tente outra busca ou categoria.</p>
    </div>

  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/products.js"></script>
<script src="js/script.js"></script>
<script src="js/footer.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const state = {
    q: "",
    categoria: params.get("categoria") || "",
    sort: "relevancia",
  };

  const grid = document.getElementById("product-grid");
  const empty = document.getElementById("empty-state");
  const resultsCount = document.getElementById("results-count");
  const categorySelect = document.getElementById("category-select");
  const sortSelect = document.getElementById("sort-select");
  const searchInput = document.getElementById("search-input");
  const pageTitle = document.getElementById("page-title");

  if (state.categoria) categorySelect.value = state.categoria;

  function updateTitle() {
    pageTitle.textContent = state.categoria ? CATEGORY_LABELS[state.categoria] : "Produtos";
  }

  function render() {
    let list = getActiveProducts().filter((p) => {
      const matchQ = p.name.toLowerCase().includes(state.q.toLowerCase());
      const matchCat = !state.categoria || p.category === state.categoria;
      return matchQ && matchCat;
    });

    if (state.sort === "menor-preco") list.sort((a, b) => a.price - b.price);
    else if (state.sort === "maior-preco") list.sort((a, b) => b.price - a.price);
    else if (state.sort === "az") list.sort((a, b) => a.name.localeCompare(b.name));

    resultsCount.textContent = `${list.length} produto${list.length !== 1 ? "s" : ""} encontrado${list.length !== 1 ? "s" : ""}`;

    if (list.length === 0) {
      grid.style.display = "none";
      empty.style.display = "block";
    } else {
      grid.style.display = "grid";
      empty.style.display = "none";
      grid.innerHTML = list.map(renderProductCard).join("");
    }
    updateTitle();
  }

  searchInput.addEventListener("input", (e) => { state.q = e.target.value; render(); });
  categorySelect.addEventListener("change", (e) => { state.categoria = e.target.value; render(); });
  sortSelect.addEventListener("change", (e) => { state.sort = e.target.value; render(); });

  resultsCount.textContent = "Carregando produtos...";
  onProductsChange(render);
</script>
</body>
</html>
