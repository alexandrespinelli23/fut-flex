<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — FutFlex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="website icon" href="img/Logo.png">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="img/Logo.png" alt="FutFlex">
      <span>FUT<em>FLEX</em></span>
    </a>
    <nav class="nav-links">
      <a href="produtos.html">Produtos</a>
      <a href="produtos.html?categoria=brasil">Brasil</a>
      <a href="produtos.html?categoria=europa">Europa</a>
      <a href="produtos.html?categoria=selecoes">Seleções</a>
    </nav>
    <div class="header-actions">
      <a href="carrinho.html" class="icon-btn" aria-label="Carrinho">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <button class="burger" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <img class="auth-img" src="img/banner.login.png" alt="Banner Login FutFlex" style="width: 100%; object-fit: cover;">
    <div class="auth-body">
      <h1>Login</h1>
      <form id="login-form" novalidate>
        <div class="field-lg">
          <label for="login-email">E-mail</label>
          <div class="input-wrap">
            <input type="email" id="login-email" required placeholder="seuemail@exemplo.com">
          </div>
        </div>
        <div class="field-lg">
          <label for="login-senha">Senha</label>
          <div class="input-wrap">
            <input type="password" id="login-senha" required placeholder="••••••••" minlength="6">
            <button type="button" class="toggle-pass" data-target="login-senha" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <p class="form-error" id="login-error">E-mail ou senha inválidos.</p>
        <div class="auth-links">
          Não tem uma conta? <a href="cadastro.html">Faça o cadastro</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Feito</button>
      </form>
    </div>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/products.js"></script>
<script src="js/script.js"></script>
<script src="js/footer.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim();
    const senha = document.getElementById("login-senha").value;
    const errorEl = document.getElementById("login-error");
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;

    try {
      const cred = await auth.signInWithEmailAndPassword(email, senha);
      console.log("✅ UID do usuário logado:", cred.user.uid);

      // Busca o documento no Firestore
      const userDoc = await db.collection("users").doc(cred.user.uid).get();
      console.log("📄 O documento existe na coleção 'users'?", userDoc.exists);

      if (userDoc.exists) {
        console.log("📦 Dados retornados do Firestore:", userDoc.data());
      }

      const role = userDoc.exists ? userDoc.data().role : "cliente";
      console.log("👑 Role identificada:", role);

      errorEl.classList.remove("show");
      showToast("Login realizado com sucesso!");
      
      setTimeout(() => {
        location.href = role === "vendedor" ? "painel-vendedor.html" : "index.html";
      }, 900);

    } catch (err) {
      console.error("❌ Erro no login:", err);
      errorEl.textContent = mapAuthError(err.code);
      errorEl.classList.add("show");
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
